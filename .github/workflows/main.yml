name: Build Android and Desktop Apps
on: [push, workflow_dispatch]
jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Automatically Install and Setup Modern Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Run Build with Auto Keystore Generation
        run: |
          GRADLE_FILE=$(find . -name "build.gradle.kts" -not -path "*/build/*" | head -n 1)
          PROJECT_ROOT=$(dirname "$GRADLE_FILE")
          echo "Building inside folder: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          # Automatically generate the missing debug security key
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          gradle assembleDebug --no-daemon
          gradle packageDistributionForCurrentOS || gradle packageDebugDistributable || echo "Desktop target not configured"
      - name: Upload Built App Files
        uses: actions/upload-artifact@v4
        with:
          name: school-app-packages
          path: |
            **/build/outputs/apk/debug/*-debug.apk
            **/build/compose/binaries/
            

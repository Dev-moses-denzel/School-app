name: Build Android and Desktop Apps
on: [push, workflow_dispatch]
jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Automatically Install and Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run Build in App Folder
        run: |
          PROJECT_ROOT=$(find . -name "build.gradle.kts" -not -path "*/build/*" | head -n 1 | xargs dirname)
          echo "Building inside folder: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          gradle assembleDebug
          gradle packageDistributionForCurrentOS || gradle packageDebugDistributable || echo "Desktop target not configured"
      - name: Upload Built App Files
        uses: actions/upload-artifact@v4
        with:
          name: school-app-packages
          path: |
            **/build/outputs/apk/debug/*-debug.apk
            **/build/compose/binaries/
            

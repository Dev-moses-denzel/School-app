name: Build Android and Desktop Apps
on: [push, workflow_dispatch]
jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Find and build Gradle project
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew wrapper file could not be found anywhere in this repository."
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$GRADLEW_PATH")
          echo "Found project directory root path at: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew packageDistributionForCurrentOS || ./gradlew packageDebugDistributable || echo "Desktop target not configured"
      - name: Upload Built App Files
        uses: actions/upload-artifact@v4
        with:
          name: school-app-packages
          path: |
            **/build/outputs/apk/debug/*-debug.apk
            **/build/compose/binaries/
            
